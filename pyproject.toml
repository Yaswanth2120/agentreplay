[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreplay"
version = "0.0.1"
description = "Record and deterministically replay AI agent LLM/tool traffic for regression testing."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
agentreplay = "agentreplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
extend-exclude = [
    "src/agentreplay/checks 2.py",
    "tests/test_checks 2.py",
    "tests/test_replay_m4 2.py",
    "tests/integration/test_run_routing 2.py",
]

[tool.setuptools.package-data]
agentreplay = ["evals/data/*.jsonl", "evals/REVIEW.md"]
